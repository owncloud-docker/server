name: Docker CI

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
  schedule:
    - cron: 0 0 * * 0
  workflow_dispatch:

jobs:
  lint:
    uses: owncloud-docker/ubuntu/.github/workflows/lint-editorconfig.yml@master

  acceptance:
    name: acceptance (${{ matrix.release.version }})
    needs: lint
    uses: ./.github/workflows/acceptance.yml
    with:
      version: ${{ matrix.release.version }}
      base: ${{ matrix.release.base }}
      tarball: ${{ matrix.release.tarball }}
      qa-sha256: ${{ matrix.release.qa-sha256 }}
      php: ${{ matrix.release.php }}
      # The weekly and manual runs run the full API suite; pushes and PRs run its
      # @smokeTest subset. The CLI suite always runs in full.
      full: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

    strategy:
      fail-fast: false
      matrix:
        release:
          - version: 10.16.7
            tarball: https://github.com/owncloud/core/releases/download/v10.16.7/owncloud-complete-20261103.tar.bz2
            qa-sha256: 97371a5b1e1f3fd334aea42e3c67419f002b26260539a15e14e2672471bafb05
            base: v22.04
            php: "7.4"
          - version: 11.1.0
            tarball: https://github.com/owncloud/core/releases/download/v11.1.0/owncloud-complete-20261103.tar.bz2
            qa-sha256: 3c063d72422938c71f2ce53900b0d719ab418f49a9b5dda65fafc76630b2e45b
            base: v24.04
            php: "8.3"

  build:
    # nothing is published unless the acceptance tests of both release lines pass
    needs: [lint, acceptance]
    uses: owncloud-docker/ubuntu/.github/workflows/docker-build.yml@master
    with:
      docker-repo-name: owncloud/${{ github.event.repository.name }}
      docker-tag: ${{ matrix.release.version }}
      docker-context: ${{ matrix.release.base }}
      docker-file: ${{ matrix.release.base }}/Dockerfile.multiarch
      docker-hub-username: ${{ vars.DOCKERHUB_USERNAME }}
      docker-build-args: |
        TARBALL_URL=${{ matrix.release.tarball }}
      push: ${{ github.ref == 'refs/heads/master' }}
      build-date-tag: true
      trivy-ignore-files: ${{ matrix.release.trivy-ignore }}
      docker-extra-tags: ${{ matrix.release.extra-tags }}
      smoke-test-port: "8080"
      smoke-test-url: "http://localhost:8080/status.php"
      smoke-test-env: |
        OWNCLOUD_DOMAIN=localhost:8080
        OWNCLOUD_TRUSTED_DOMAINS=localhost:8080
        OWNCLOUD_DB_TYPE=sqlite
      smoke-test-version-jq: ${{ matrix.release.smoke-version-jq }}
    secrets:
      docker-hub-password: ${{ secrets.DOCKERHUB_TOKEN }}

    strategy:
      # Each release line builds, scans and publishes independently: a Trivy
      # failure in one must not cancel the other's publish.
      fail-fast: false
      matrix:
        release:
          - version: 10.16.7
            tarball: https://github.com/owncloud/core/releases/download/v10.16.7/owncloud-complete-20261103.tar.bz2
            base: v22.04
            trivy-ignore: v22.04/10.16.7/.trivyignore
            extra-tags: |
              10.16
              10
              latest
            smoke-version-jq: ".versionstring"
          - version: 11.1.0
            tarball: https://github.com/owncloud/core/releases/download/v11.1.0/owncloud-complete-20261103.tar.bz2
            base: v24.04
            trivy-ignore: v24.04/11.1.0/.trivyignore
            extra-tags: |
              11.1
              11
            smoke-version-jq: ".versionstring"

  update-docker-hub-description:
    needs: build
    if: github.ref == 'refs/heads/master'
    uses: owncloud-docker/ubuntu/.github/workflows/docker-hub-desc.yml@master
    with:
      docker-repo-name: owncloud/${{ github.event.repository.name }}
      docker-repo-description: ownCloud - Secure Collaboration Platform
      docker-hub-username: ${{ vars.DOCKERHUB_USERNAME }}
    secrets:
      docker-hub-password: ${{ secrets.DOCKERHUB_TOKEN }}
