name: Docker CI

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
  schedule:
    - cron: 0 0 * * 0

jobs:
  lint:
    uses: owncloud-docker/ubuntu/.github/workflows/lint-editorconfig.yml@master

  build:
    needs: lint
    uses: owncloud-docker/ubuntu/.github/workflows/docker-build.yml@master
    with:
      docker-repo-name: owncloud/${{ github.event.repository.name }}
      docker-tag: ${{ matrix.release.version }}
      docker-context: ${{ matrix.release.base }}
      docker-file: ${{ matrix.release.base }}/Dockerfile.multiarch
      docker-hub-username: ${{ vars.DOCKERHUB_USERNAME }}
      docker-build-args: |
        TARBALL_URL=${{ matrix.release.tarball }}
      push: ${{ github.ref == 'refs/heads/master' }}
      build-date-tag: true
      trivy-ignore-files: ${{ matrix.release.trivy-ignore }}
      docker-extra-tags: ${{ matrix.release.extra-tags }}
      smoke-test-port: "8080"
      smoke-test-url: "http://localhost:8080/status.php"
      smoke-test-env: |
        OWNCLOUD_DOMAIN=localhost:8080
        OWNCLOUD_TRUSTED_DOMAINS=localhost:8080
        OWNCLOUD_DB_TYPE=sqlite
      smoke-test-version-jq: ${{ matrix.release.smoke-version-jq }}
    secrets:
      docker-hub-password: ${{ secrets.DOCKERHUB_TOKEN }}

    strategy:
      matrix:
        release:
          # No qa-tarball, so the acceptance job skips this release. v10.16.4
          # does publish one, and its run.sh takes --remote and --part just like
          # 11.x, so wiring it up is a small follow-up - but it has not been
          # tried against this image yet, and 10.x uses config/behat.yml where
          # 11.x uses behat.php. Verify before adding it.
          - version: 10.16.4
            tarball: https://github.com/owncloud/core/releases/download/v10.16.4/owncloud-complete-20260729.tar.bz2
            base: v22.04
            trivy-ignore: v22.04/10.16.4/.trivyignore
            extra-tags: |
              10.16
              10
              latest
            smoke-version-jq: ".versionstring"
          - version: 11.0.0-rc3
            tarball: https://github.com/owncloud/core/releases/download/v11.0.0-rc3/owncloud-complete-20260729.tar.bz2
            qa-tarball: https://github.com/owncloud/core/releases/download/v11.0.0-rc3/owncloud-complete-20260729-qa.tar.bz2
            core-ref: v11.0.0-rc3
            base: v24.04
            trivy-ignore: v24.04/11.0.0-rc3/.trivyignore
            smoke-version-jq: ""

  # Functional test of the published image. Deliberately not run on pull
  # requests: those are mostly renovate digest bumps and the ~4 min build loop
  # should stay that fast. Run the full set manually via the acceptance
  # workflow's dispatch inputs.
  acceptance:
    needs: build
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/acceptance.yml
    with:
      image: owncloud/${{ github.event.repository.name }}
      # The build tags with the version and, via build-date-tag, a dated
      # variant. The plain version tag is the one that always exists.
      image-tag: ${{ matrix.release.version }}
      qa-tarball: ${{ matrix.release.qa-tarball }}
      core-ref: ${{ matrix.release.core-ref }}
      test-type: ${{ matrix.suites.type }}
      shards: ${{ matrix.suites.shards }}

    strategy:
      fail-fast: false
      matrix:
        # Shards split by suite count, so keep the count at or below the number
        # of suites - 61 api and 9 cli in 11.x - otherwise the surplus shards
        # start a full server stack only to find they have nothing to run.
        suites:
          - type: api
            shards: 10
          - type: cli
            shards: 3
        release:
          - version: 11.0.0-rc3
            qa-tarball: https://github.com/owncloud/core/releases/download/v11.0.0-rc3/owncloud-complete-20260729-qa.tar.bz2
            core-ref: v11.0.0-rc3

  update-docker-hub-description:
    needs: build
    if: github.ref == 'refs/heads/master'
    uses: owncloud-docker/ubuntu/.github/workflows/docker-hub-desc.yml@master
    with:
      docker-repo-name: owncloud/${{ github.event.repository.name }}
      docker-repo-description: ownCloud - Secure Collaboration Platform
      docker-hub-username: ${{ vars.DOCKERHUB_USERNAME }}
    secrets:
      docker-hub-password: ${{ secrets.DOCKERHUB_TOKEN }}
